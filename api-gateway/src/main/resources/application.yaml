server:
  port: 8084

spring:
  application:
    name: api-gateway

  # ==============================================
  # Configuracion de rutas del Gateway
  # ==============================================
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: huesped-service
              uri: lb://HUESPED-SERVICE
              predicates:
                - Path=/huespedes/**

            - id: hotel-service
              uri: lb://HOTEL-SERVICE
              predicates:
                - Path=/hoteles/**,/habitaciones/**

            - id: calificacion-service
              uri: lb://CALIFICACION-SERVICE
              predicates:
                - Path=/calificaciones/**


  # ==============================================
  # Punto de entrada para los clientes
  # ==============================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/proyecto02-microservicios-realm

# ==============================================
# Configuración de Eureka (Client)
# ==============================================
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka:123456@localhost:8761/eureka
#      defaultZone: http://localhost:8761/eureka/

# Opcional: Permite mostrar logs
# NO debe usarse en produccion
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG